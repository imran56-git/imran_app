name: Deploy Firebase Cloud Functions

on:
  push:
    paths:
      - 'functions/**'
      - '.github/workflows/deploy_functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create firebase.json and credentials
        env:
          GCP_SA_KEY: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          cat << 'EOF' > firebase.json
          {
            "functions": [
              {
                "source": "functions",
                "codebase": "default"
              }
            ]
          }
          EOF
          echo "$GCP_SA_KEY" > /tmp/gcp_key.json

      - name: Install Firebase Functions dependencies
        run: cd functions && npm install

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_key.json
          GCP_SA_KEY: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          PROJECT_ID=$(node -e 'console.log(JSON.parse(process.env.GCP_SA_KEY).project_id)')
          npx -y firebase-tools deploy --only functions --project "$PROJECT_ID" --force
