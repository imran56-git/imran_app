name: Flutter Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create google-services.json
        run: |
          cat << 'EOF' > android/app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          EOF

      - name: Create service_account.json for FCM
        run: |
          cat << 'EOF' > assets/service_account.json
          ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Generate Keystore Automatically
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias upload -passin pass:${{ secrets.KEYSTORE_STORE_PASSWORD }} \
          -passout pass:${{ secrets.KEYSTORE_STORE_PASSWORD }} \
          -dname "CN=Imran, OU=FYBTT, O=FYBTT, L=Kalsara, ST=WB, C=IN"
          
          echo "storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: >
          flutter build apk --release --no-shrink
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
