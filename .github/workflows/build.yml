name: Flutter Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create google-services.json
        run: |
          cat << 'EOF' > android/app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          EOF

      - name: Create service_account.json for FCM
        run: |
          cat << 'EOF' > assets/service_account.json
          ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Setup Fixed Keystore
        run: |
          KEYSTORE_PASS="${{ secrets.KEYSTORE_STORE_PASSWORD }}"
          if [ -z "$KEYSTORE_PASS" ]; then
            KEYSTORE_PASS="ImranSecret123"
          fi

          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          else
            keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEYSTORE_PASS" \
            -dname "CN=Imran, OU=FYBTT, O=FYBTT, L=Kalsara, ST=WB, C=IN"
            
            echo "--- COPY KEYSTORE BASE64 BELOW ---"
            base64 -w 0 android/app/upload-keystore.jks
            echo ""
            echo "--- END KEYSTORE BASE64 ---"
          fi
          
          echo "storePassword=$KEYSTORE_PASS" > android/key.properties
          echo "keyPassword=$KEYSTORE_PASS" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Print SHA-1 Fingerprint for Firebase
        run: |
          KEYSTORE_PASS="${{ secrets.KEYSTORE_STORE_PASSWORD }}"
          if [ -z "$KEYSTORE_PASS" ]; then
            KEYSTORE_PASS="ImranSecret123"
          fi
          keytool -list -v -keystore android/app/upload-keystore.jks -alias upload -storepass "$KEYSTORE_PASS"

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: >
          flutter build apk --release --no-shrink
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk