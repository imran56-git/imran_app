name: find_your_best_teacher_today
description: A Flutter app to find your best teacher today.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  lottie: ^3.6.1
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5 
  flutter_markdown: ^0.7.7+1

  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.10
  firebase_storage: ^12.4.10
  flutter_local_notifications: ^18.0.1  
  google_generative_ai: ^0.4.7
  equatable: ^2.1.0
  image_picker: ^1.2.4
  file_picker: ^8.3.7
  path_provider: ^2.1.6
  permission_handler: ^11.4.0
  uuid: ^4.6.0

  geolocator: ^11.1.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.18.2
  google_sign_in: ^6.3.0
  url_launcher: ^6.3.3

  intl: ^0.19.0
  font_awesome_flutter: ^10.12.0
  flutter_image_compress: ^2.5.1

  emoji_picker_flutter: ^4.5.4
  flutter_sound: ^9.30.0
  audioplayers: ^6.8.1
  animate_do: ^3.3.9
  flutter_animate: ^4.5.2

  jitsi_meet_flutter_sdk: ^11.6.0

  camera: ^0.11.4
  google_mlkit_face_detection: ^0.13.2
  google_mlkit_text_recognition: ^0.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0

dependency_overrides:
  google_mlkit_commons: ^0.11.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animation/
